[package]
name = "talaan"
version = "1.0.0-dev"
description = "Bot-free meeting recorder"
authors = ["Miguel Monzones"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "talaan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
members = [".", "llm", "llm-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
rand = "0.10.3"
thiserror = "2.0.21"
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.1"
hound = "3.5.1"
whisper-rs = "0.16.0"
parakeet-rs = "0.3.8"
# parakeet-rs 0.3.8 does not build against ort 2.0.0-rc.14 (Session::builder changed); keep rc.13 until it does.
ort = { version = "=2.0.0-rc.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = "0.10.9"
strsim = "0.11.1"
whatlang = "0.18.0"
talaan-llm-protocol = { path = "llm-protocol" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
block2 = "0.6.2"
mach2 = "0.7.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"

# Dependencies are always optimized, even in debug builds: whisper.cpp (built through CMake, which follows
# opt-level) and the Rust audio math (mel features, resampling) are 10x+ slower unoptimized, and the signed
# debug app is what real calls are tested on. Talaan's own code stays fast to compile.
[profile.dev.package."*"]
opt-level = 3
