[package]
name = "talaan-stt"
version = "1.2.0"
description = "Talaan's speech helper (Whisper on Windows): the engine's helper with Talaan's prefix; talaan-stt-vulkan is its Vulkan build"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "talaan-stt"
path = "src/main.rs"

[dependencies]
voice-engine-stt = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.3.0" }
voice-engine-protocol = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.3.0" }

[features]
# Windows GPU build (talaan-stt-vulkan.exe), never linked into talaan.exe: needs the Vulkan SDK (VULKAN_SDK) to
# build and vulkan-1.dll to run. scripts/build-llm-helper.ps1 builds it only when VULKAN_SDK is set.
vulkan = ["voice-engine-stt/vulkan"]
