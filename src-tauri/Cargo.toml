[package]
name = "talaan"
version = "1.0.0-dev"
description = "Bot-free meeting recorder"
authors = ["Miguel Monzones"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "talaan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
members = [".", "llm", "llm-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
rand = "0.10.3"
thiserror = "2.0.21"
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.1"
hound = "3.5.1"
whisper-rs = "0.16.0"
parakeet-rs = { version = "0.3.8", features = ["sortformer"] }
# parakeet-rs 0.3.8 does not build against ort 2.0.0-rc.14 (Session::builder changed); keep rc.13 until it does.
ort = { version = "=2.0.0-rc.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
sha2 = "0.10.9"
strsim = "0.11.1"
whatlang = "0.18.0"
symphonia = { version = "0.5.5", features = ["aac", "isomp4", "mp3", "aiff", "alac", "caf"] }
talaan-llm-protocol = { path = "llm-protocol" }
keyring = "3.6.3"
rrule = "0.14.0"
chrono-tz = "0.10.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
block2 = "0.6.2"
mach2 = "0.7.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"
objc2-event-kit = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# CPU for now; GPU (vulkan) after the W1 checkpoint, see "Later" in docs/plans/W0-W1-windows-build-and-recorder.md.
whisper-rs = "0.16.0"
wasapi = "0.26.0"
winreg = "0.56.0"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
tauri-winrt-notification = "0.8"
tauri-plugin-single-instance = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

# Dependencies are always optimized, even in debug builds: whisper.cpp (built through CMake, which follows
# opt-level) and the Rust audio math (mel features, resampling) are 10x+ slower unoptimized, and the signed
# debug app is what real calls are tested on. Talaan's own code stays fast to compile.
[profile.dev.package."*"]
opt-level = 3
