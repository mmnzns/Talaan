name: Release

# Push a tag like v1.0.0. This makes a draft GitHub Release with:
#   Windows (CI):  Talaan_<v>_x64-setup.exe and its .sig (built by scripts/release-windows.ps1)
#   Mac:           the .dmg, Talaan_aarch64.app.tar.gz and its .sig, uploaded from the Mac with
#                  scripts/release-local.sh then scripts/upload-mac-release.sh <tag> (or by the macos job below
#                  once the APPLE_CERTIFICATE secrets exist and the repo variable MAC_RELEASE_ON_CI is "true")
#   latest.json:   rebuilt from every .sig on the release by scripts/latest-json.mjs, by whoever uploads last
# The draft's notes are this version's CHANGELOG.md section (scripts/release-notes.mjs); the draft job fails, and
# nothing is built or drafted, when CHANGELOG.md has no "## <version> (date)" section for the tag. latest.json's
# `notes` carry the same section as plain text.
# Run the Mac upload (scripts/upload-mac-release.sh) only after this workflow's updater-json job has finished, then
# check that latest.json has four keys (the script checks it too). latest-json.mjs reads its upload back and retries,
# but two uploads at once can still race.
# Publish the draft by hand after the release gate (docs/TESTING.md).
# With MAC_RELEASE_ON_CI "true" the whole release is built here (Windows and Mac), so it can be cut from either computer:
# bump the version and CHANGELOG, push a tag, wait for updater-json, check the draft (six files, latest.json with four
# keys), publish. scripts/release-local.sh + upload-mac-release.sh stay as the fallback when CI's Mac job can't run.
# The helper programs (talaan-llm, talaan-stt, and on Windows x64 their -vulkan variants) are built by the engine's
# reusable workflow (the `helpers` job, voice-engine v0.3.0: its .cargo/config.toml CPU baseline applies there) and
# downloaded by the jobs that build the app, as Tauri sidecars in src-tauri/binaries. Those jobs set
# TALAAN_HELPERS_PREBUILT=1 so scripts/build-llm-helper.* and scripts/release-windows.ps1 build no helper themselves.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY / _PASSWORD   Talaan's updater key (minisign), used by both platforms
#   APPLE_CERTIFICATE                       macos job only: base64 of the exported code-signing .p12 (self-signed)
#   APPLE_CERTIFICATE_PASSWORD              its export password
#   APPLE_SIGNING_IDENTITY                  the certificate's name ("Parlato Code Signing", shared with Parlato)
# On the Mac a stable signature is what keeps the microphone, system audio, calendar and automation permissions
# across updates, so the macos job fails rather than ship unsigned.

on:
  push:
    tags: ["v*"]
  # Test build: Actions › Release › Run workflow (pick the branch). Builds the signed Windows installer exactly like
  # a release and keeps it as a workflow artifact; no tag, no release, no latest.json.
  # Mac test build (macos-test): the signed .dmg as an artifact, to check the certificate secrets work on CI.
  workflow_dispatch:
    inputs:
      platform:
        description: Which test build
        type: choice
        options: [both, windows, mac]
        default: both

permissions:
  contents: write

jobs:
  # The engine's own workflow builds the helpers (the same tag for @ref and engine-ref). It runs on every trigger,
  # because windows-test/macos-test (dispatch) and windows (tag) all need it. A Mac-only test build asks for the AI
  # helper only, so the Windows targets (Vulkan shaders take long) aren't built for nothing.
  helpers:
    permissions:
      contents: read
    uses: mmnzns/voice-engine/.github/workflows/build-helpers.yml@v0.3.0
    with:
      engine-ref: v0.3.0
      # What Talaan ships and downloads below: Mac Apple silicon and Windows x64. No Windows ARM64 build.
      targets: x86_64-pc-windows-msvc,aarch64-apple-darwin
      helpers: ${{ inputs.platform == 'mac' && 'llm' || 'llm,stt,llm-vulkan,stt-vulkan' }}
      llm-name: talaan-llm
      stt-name: talaan-stt

  windows-test:
    needs: helpers
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'mac'
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      TALAAN_HELPERS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: helpers-x86_64-pc-windows-msvc
          path: src-tauri/binaries
      - name: The helpers (build log line, then drop the extras)
        shell: bash
        run: |
          cat src-tauri/binaries/build-info.txt
          rm -f src-tauri/binaries/SHA256SUMS src-tauri/binaries/build-info.txt
          ls -l src-tauri/binaries
      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: talaan-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
          if-no-files-found: error

  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This version's CHANGELOG.md section (soft-wrapped lines joined) plus the install text from
      # scripts/release-notes.md. Fails the release when CHANGELOG.md has no section for the version, so nothing is
      # drafted without notes. Same script as scripts/upload-mac-release.sh and latest.json's notes.
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Draft release for this tag (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Talaan $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  windows:
    needs: [draft, helpers]
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      TALAAN_HELPERS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: helpers-x86_64-pc-windows-msvc
          path: src-tauri/binaries
      - name: The helpers (build log line, then drop the extras)
        shell: bash
        run: |
          cat src-tauri/binaries/build-info.txt
          rm -f src-tauri/binaries/SHA256SUMS src-tauri/binaries/build-info.txt
          ls -l src-tauri/binaries
      # Bundles the downloaded helpers, builds the installer and its updater signature; fails if the app's
      # whisper.cpp wasn't built with -O2 for the baseline, if talaan.exe imports vulkan-1.dll, or if a -vulkan
      # helper doesn't.
      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release-windows.ps1
      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"; out=src-tauri/target/release/bundle/nsis
          gh release upload "$GITHUB_REF_NAME" "$out/Talaan_${v}_x64-setup.exe" "$out/Talaan_${v}_x64-setup.exe.sig" --clobber

  macos:
    needs: [draft, helpers]
    if: vars.MAC_RELEASE_ON_CI == 'true'
    runs-on: macos-latest
    env:
      TALAAN_HELPERS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-arm64
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: helpers-aarch64-apple-darwin
          path: src-tauri/binaries
      - name: The helpers (build log line, then drop the extras)
        run: |
          cat src-tauri/binaries/build-info.txt
          # The Mac ships the AI helper only.
          rm -f src-tauri/binaries/SHA256SUMS src-tauri/binaries/build-info.txt src-tauri/binaries/talaan-stt-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*-apple-darwin
          ls -l src-tauri/binaries

      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; }

      - name: Turn on updater artifacts
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Signing certificate into a temporary keychain
        uses: ./.github/actions/mac-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Build, sign and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Talaan ${{ github.ref_name }}"
          releaseDraft: true
          includeUpdaterJson: false
          args: --target aarch64-apple-darwin

      # The draft's notes come from the draft job (CHANGELOG.md section); put them back only if tauri-action replaced
      # them, so notes edited by hand on the draft while this job ran are kept.
      - name: Keep the release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          case "$body" in
            "## What's new in "*) echo "Release notes intact." ;;
            *) node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
               gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" ;;
          esac

      - name: Signature check
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Talaan.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" | grep -q device.audio-input

  macos-test:
    needs: helpers
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'windows'
    runs-on: macos-latest
    env:
      TALAAN_HELPERS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-arm64
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: helpers-aarch64-apple-darwin
          path: src-tauri/binaries
      - name: The helpers (build log line, then drop the extras)
        run: |
          cat src-tauri/binaries/build-info.txt
          # The Mac ships the AI helper only.
          rm -f src-tauri/binaries/SHA256SUMS src-tauri/binaries/build-info.txt src-tauri/binaries/talaan-stt-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*-apple-darwin
          ls -l src-tauri/binaries
      - name: Turn on updater artifacts
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Signing certificate into a temporary keychain
        uses: ./.github/actions/mac-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- --target aarch64-apple-darwin
      - name: Signature check
        run: |
          out=src-tauri/target/aarch64-apple-darwin/release/bundle
          codesign --verify --deep --strict --verbose=2 "$out/macos/Talaan.app"
          codesign -d --entitlements - "$out/macos/Talaan.app" | grep -q device.audio-input
          # Same identity as the Mac's local builds, so permissions carry over.
          codesign -dvv "$out/macos/Talaan.app" 2>&1 | grep -E "^Authority|^TeamIdentifier"
          ls "$out"/dmg/*.dmg "$out"/macos/*.tar.gz.sig
      - uses: actions/upload-artifact@v4
        with:
          name: talaan-mac-test
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

  updater-json:
    needs: [windows, macos]
    if: ${{ always() && needs.windows.result == 'success' && needs.macos.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/latest-json.mjs "$GITHUB_REF_NAME"
