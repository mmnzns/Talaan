[package]
name = "talaan"
version = "1.1.1"
description = "Bot-free meeting recorder"
authors = ["Miguel Monzones"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "talaan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test builds only: the updater end-to-end test (.github/workflows/updater-test.yml) turns this on through its
# config overlay. Release builds never do; scripts/release-windows.ps1 checks talaan.exe for it.
updater-e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
members = [".", "llm", "llm-protocol", "stt"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
rand = "0.10.3"
thiserror = "2.0.21"
# The shared engine (docs/plans/2026-10-30-engine-v0.2.2.md). The old speech and AI code stays until the later tasks remove it.
voice-engine-protocol = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.2" }
voice-engine-models = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.2" }
voice-engine-client = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.2" }
voice-engine-stt = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.2" }
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.1"
hound = "3.5.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
sha2 = "0.10.9"
strsim = "0.11.1"
whatlang = "0.18.0"
symphonia = { version = "0.5.5", features = ["aac", "isomp4", "mp3", "aiff", "alac", "caf"] }
talaan-llm-protocol = { path = "llm-protocol" }
keyring = "3.6.3"
rrule = "0.14.0"
chrono-tz = "0.10.4"
# The log file (src/logging.rs writes and rotates it; already in the tree through Tauri).
log = "0.4.34"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
# The engine's MACOSX_DEPLOYMENT_TARGET 11.0 makes ggml's Metal code call `__isPlatformVersionAtLeast`, and under LTO that
# symbol fails to link on macOS. The speed that matters is in the C++ libraries, which LTO never touched.
lto = false
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
block2 = "0.6.2"
mach2 = "0.7.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"
objc2-event-kit = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# Parakeet on the PC's discrete card, in Talaan's own process, and discrete_card() for the graphics card default.
voice-engine-stt = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.2", features = ["directml"] }
wasapi = "0.26.0"
winreg = "0.56.0"
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "UI_Notifications",
] }
windows-core = "0.62"
tauri-winrt-notification = "0.8"
tauri-plugin-single-instance = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

# Dependencies are always optimized, even in debug builds: whisper.cpp (built through CMake, which follows
# opt-level) and the Rust audio math (mel features, resampling) are 10x+ slower unoptimized, and the signed
# debug app is what real calls are tested on. Talaan's own code stays fast to compile.
[profile.dev.package."*"]
opt-level = 3
