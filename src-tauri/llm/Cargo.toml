[package]
name = "talaan-llm"
version = "1.2.0"
description = "Talaan's local AI helper: the engine's llama.cpp helper, in its own process"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
voice-engine-llm = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.3.0" }
voice-engine-protocol = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.3.0" }

[features]
# Windows GPU build (talaan-llm-vulkan.exe): needs the Vulkan SDK (VULKAN_SDK) to build, and vulkan-1.dll, which
# GPU drivers install, to run. scripts/build-llm-helper.ps1 builds it only when VULKAN_SDK is set.
vulkan = ["voice-engine-llm/vulkan"]
